# LocalStack Initialization ConfigMap
# Contains startup script that creates required S3 bucket and SQS queue
# Script runs automatically when LocalStack pod starts
apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
data:
  # Initialization script for LocalStack resources
  init-aws.sh: |
    #!/bin/bash
    echo "Initializing LocalStack resources..."
    # Create S3 bucket for storing uploaded files
    # || true prevents script failure if bucket already exists
    awslocal s3 mb s3://clipsearch || true
    # Create SQS queue for file indexing messages
    # || true prevents script failure if queue already exists
    awslocal sqs create-queue --queue-name clipsearch-index-queue || true
    echo "Initialization complete."
