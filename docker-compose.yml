services:
  localstack:
    image: localstack/localstack:4.12.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - DEBUG=0
    volumes:
      - "./scripts/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"

  elasticsearch:
    image: elasticsearch:8.19.10
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - node.store.allow_mmap=false
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data

  api:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - S3_ENDPOINT=http://localstack:4566
      - SQS_ENDPOINT=http://localstack:4566
      - ES_URL=elasticsearch:9200
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - S3_BUCKET=clipsearch
      - SQS_QUEUE_NAME=clipsearch-index-queue
      - QUARKUS_HTTP_CORS=true
    depends_on:
      - localstack
      - elasticsearch

  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    environment:
      - S3_ENDPOINT=http://localstack:4566
      - SQS_ENDPOINT=http://localstack:4566
      - ES_URL=elasticsearch:9200
      - RHOAI_BASE_URL=${RHOAI_BASE_URL:-http://ollama:11434/v1}
      - RHOAI_API_KEY=${RHOAI_API_KEY:-ollama}
      - RHOAI_MODEL_NAME=${RHOAI_MODEL_NAME:-tinyllama}
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - S3_BUCKET=clipsearch
      - SQS_QUEUE_NAME=clipsearch-index-queue
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - localstack
      - elasticsearch
      - api
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Automatically pull the model on startup
    entrypoint: /bin/sh
    command: -c "ollama serve & sleep 10 && ollama pull tinyllama && wait"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:8080"
    depends_on:
      - api

volumes:
  es_data:
  ollama_data: