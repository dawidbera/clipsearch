apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-standalone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-standalone
  template:
    metadata:
      labels:
        app: llm-standalone
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: HOME
              value: "/tmp"
          resources:
            requests:
              memory: "1Gi"
              cpu: "1"
            limits:
              memory: "2Gi"
              cpu: "2"
          volumeMounts:
            - name: ollama-data
              mountPath: /tmp/.ollama
      initContainers:
        - name: pull-model
          image: ollama/ollama:latest
          command: ["sh", "-c"]
          args:
            - |
              ollama serve & 
              sleep 5
              ollama pull tinyllama
              pkill ollama
          env:
            - name: HOME
              value: "/tmp"
          volumeMounts:
            - name: ollama-data
              mountPath: /tmp/.ollama
      volumes:
        - name: ollama-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-standalone
spec:
  selector:
    app: llm-standalone
  ports:
    - port: 80
      targetPort: 11434
