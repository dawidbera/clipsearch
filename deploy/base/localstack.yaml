apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: clipsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:4.12.0
          env:
            - name: SERVICES
              value: "s3,sqs"
            - name: DEBUG
              value: "0"
          ports:
            - containerPort: 4566
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 4566
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4566
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: init-scripts
              mountPath: /etc/localstack/init/ready.d
      volumes:
        - name: init-scripts
          configMap:
            name: localstack-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: clipsearch
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
