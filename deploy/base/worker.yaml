apiVersion: apps/v1
kind: Deployment
metadata:
  name: clipsearch-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clipsearch-worker
  template:
    metadata:
      labels:
        app: clipsearch-worker
    spec:
      containers:
        - name: clipsearch-worker
          image: clipsearch-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: clipsearch-config
            - secretRef:
                name: clipsearch-aws-secret
          env:
            - name: RHOAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clipsearch-rhoai-secret
                  key: RHOAI_API_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
