# Continuous Integration Workflow
# Builds and pushes Docker images for API, Worker, and Frontend to GitHub Container Registry
# Triggered on push to main branch or pull requests

name: CI - Build and Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}/clipsearch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-worker
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-frontend
          tags: |
            type=raw,value=main
            type=sha,format=short

      - name: Build and push API image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api:main,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api:${{ github.sha }}

      - name: Build and push Worker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-worker:main,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-worker:${{ github.sha }}

      - name: Build and push Frontend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-frontend:main,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-frontend:${{ github.sha }}