apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: clipsearch-frontend
spec:
  to:
    kind: Service
    name: clipsearch-frontend
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: clipsearch-api
spec:
  to:
    kind: Service
    name: clipsearch-api
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect