# HTTP (Health)
quarkus.http.port=8080

# AWS S3
quarkus.s3.aws.region=${AWS_REGION:us-east-1}
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:test}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}
quarkus.s3.endpoint-override=${S3_ENDPOINT_INTERNAL:${S3_ENDPOINT:http://localhost:4566}}
quarkus.s3.path-style-access=true

# AWS SQS
quarkus.sqs.aws.region=${AWS_REGION:us-east-1}
quarkus.sqs.aws.credentials.type=static
quarkus.sqs.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:test}
quarkus.sqs.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}
quarkus.sqs.endpoint-override=${SQS_ENDPOINT:http://localhost:4566}

# Elasticsearch
quarkus.elasticsearch.hosts=${ES_URL:localhost:9200}

# Application Config
clipsearch.sqs.queue=${SQS_QUEUE_NAME:clipsearch-index-queue}
clipsearch.es.index=${ES_INDEX:clipsearch-uploads}

# Red Hat OpenShift AI Configuration (OpenAI Compatible)
quarkus.langchain4j.openai.base-url=${RHOAI_BASE_URL:https://api.openai.com/v1}
quarkus.langchain4j.openai.api-key=${RHOAI_API_KEY:no-key}
quarkus.langchain4j.openai.chat-model.model-name=${RHOAI_MODEL_NAME:model}
quarkus.langchain4j.openai.chat-model.temperature=0.1
quarkus.langchain4j.openai.timeout=60s
# Feature toggle for AI
clipsearch.ai.enabled=${AI_ENABLED:true}


# Logging
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n